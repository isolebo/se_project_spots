<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SPot2" />
    <meta name="author" content="newContent" />
    <meta name="keywords" content="Image Sharing" />
    <link rel="stylesheet" href="./pages/index.css" />
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />

    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%=require('./images/Logo.svg')%>"
          alt="Spot Logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img
                src="<%=require('./images/pencil-light.svg')%>"
                alt="Spot Logo"
                class="Pencil icon"
              />
            </button>
            <img
              src="<%=require('./images/avatar.jpg')%>"
              alt="Bessie Coleman"
              class="profile__avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img
                src="<%=require('./images/pencil.svg')%>"
                alt="Pencil Icon"
              />Edit Profile
            </button>
          </div>
          <button class="profile__new-post-btn" type="button">
            <img src="<%=require('./images/plus.svg')%>" alt="Plus Icon" />New
            Post
          </button>
        </section>

        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button
                  class="card__delete-btn"
                  type="button"
                  aria-label="Delete card"
                ></button>
                <img src="" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title">Val Thorens</h2>
                  <button
                    type="button"
                    class="card__like-btn"
                    aria-label="Like card"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>

      <footer class="footer">
        <p class="footer__copyright">2025 &copy; Spots</p>
      </footer>

      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img src="<%=require('./images/close.svg')%>" alt="Close Icon" />
          </button>
          <h2 class="modal__title">Edit profile</h2>
          <form class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                name="name"
                class="modal__input"
                placeholder="Type your name"
                required
                minlength="2"
                maxlength="40"
              />
              <span class="modal__error" id="profile-name-input-error"></span>
            </label>
            <label for="profile-description-input" class="modal__label"
              >Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                required
                minlength="2"
                maxlength="200"
              />
              <span
                class="modal__error"
                id="profile-description-input-error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img src="<%=require('./images/close.svg')%>" alt="Close Icon" />
          </button>
          <h2 class="modal__title">New Post</h2>
          <form class="modal__form" novalidate>
            <label for="card-link-input" class="modal__label">
              Image Link
              <input
                id="card-link-input"
                type="url"
                class="modal__input"
                name="description"
                placeholder="Place a link to the picture"
                required
              />
              <span id="card-link-input-error" class="modal__error"></span>
            </label>
            <label for="card-caption-input" class="modal__label"
              >Caption
              <input
                id="card-caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                required
                minlength="2"
                maxlength="30"
              />
              <span class="modal__error" id="card-caption-input-error"></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal modal_type_preview" id="preview-modal">
        <div class="modal__image-container">
          <button
            type="button"
            class="modal__close-btn modal__close-btn_type_preview"
            aria-label="Close modal"
          >
            <img
              src="<%=require('./images/previewClose.svg')%>"
              alt="Close Icon"
            />
          </button>
          <img src="#" alt="" class="modal__image" />
          <p class="modal__caption"></p>
        </div>
      </div>
    </div>

    <div class="modal" id="avatar-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn">
          <img src="<%=require('./images/close.svg')%>" alt="Close Icon" />
        </button>
        <h2 class="modal__title">Edit Profile Avatar</h2>
        <form class="modal__form" id="edit-avatar-form">
          <label for="profile-avatar-input" class="modal__label">
            Avatar Name
            <input
              id="avatar-input"
              name="avatar"
              class="modal__input"
              placeholder="avatar"
              required
            />
            <span class="modal__error" id="avatar-input-error"></span>
          </label>

          <button type="submit" class="modal__submit-btn">Save</button>
        </form>
      </div>
    </div>
    <!-- style the modal -->
    <div class="modal" id="delete-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn">
          <img src="<%=require('./images/close.svg')%>" alt="Close Icon" />
        </button>
        <button
          type="button"
          class="modal__close"
          aria-label="Close modal"
        ></button>
        <h2 class="modal__title">
          Are you sure you waant to delete this image?
        </h2>
        <form class="modal__form" id="delete-form">
          <button type="submit" class="modal__button modal__submit-btn">
            Deleting
          </button>
          <button type="button" class="modal__button" id="cancel-delete-btn">
            Save
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
